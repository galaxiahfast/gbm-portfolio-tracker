[pytest]
testpaths = tests
filterwarnings =
    # pandas 2.x builds Timedelta with NumPy's deprecated 'generic' unit
    # internally (NumPy >= 2.5). Not caused by project code; hiding it keeps
    # real warnings visible. requirements.txt caps NumPy below the release
    # that could turn it into an error.
    ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning
